services:
  db:
    image: mysql:8.4
    mem_limit: 512m
    command: [--innodb-buffer-pool-size=64M, --performance-schema=OFF, --mysqlx=OFF, --max-connections=30]
    environment:
      MYSQL_DATABASE: hololearn
      MYSQL_USER: hololearn
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD dalam .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD dalam .env}
    volumes:
      - database:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    mem_limit: 512m
    ports:
      - "127.0.0.1:${APP_PORT:-18095}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: hololearn
      DB_USER: hololearn
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD dalam .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Isi ADMIN_EMAIL dalam .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Isi ADMIN_PASSWORD dalam .env}
      JAVA_OPTS: -Xms64m -Xmx320m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
volumes:
  database:
